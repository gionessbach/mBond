/* Layout: eine Bühne pro Schritt, mittig, große Tippflächen; Familien-DNA von mZip/mFlow, aber hell und warm */
:root{
  --bg:#F4F1E8;
  --surface:#FFFCF5;
  --line:#E5DCC8;
  --fg:#262625;
  --muted:#655D53;
  --accent:#FFC629;
  --heart:#FF7A6B;
  --heart-soft:#FBDCD5;
  --heart-empty:#D8CCB4;
  --display:"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --body:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F2125;--surface:#2A2D33;--line:#3A3F47;--fg:#F4F1E8;--muted:#B4B9C1;
  --accent:#FFC629;--heart:#FF8A7C;--heart-soft:#4A3230;--heart-empty:#535965;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F2125;--surface:#2A2D33;--line:#3A3F47;--fg:#F4F1E8;--muted:#B4B9C1;
  --accent:#FFC629;--heart:#FF8A7C;--heart-soft:#4A3230;--heart-empty:#535965;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding-block:14px 6px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;font-size:22px}
.mark{width:32px;height:32px;border-radius:9px;overflow:hidden;flex:none}
.mark svg{display:block;width:100%;height:100%}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line)}
.icon-btn svg{width:22px;height:22px}

.screen{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:10px 22px;min-height:0;animation:in .35s ease}
@keyframes in{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600}
h2,.h2like{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.2;text-align:center}
.say{display:flex;gap:10px;align-items:center;justify-content:center}
.say .icon-btn{flex:none}
.hint{color:var(--muted);text-align:center;font-size:15px;line-height:1.4;margin:0}

/* Start */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:8px}
.hero svg{width:min(62vw,240px);height:auto}
.hero h1{font-size:44px;font-weight:700}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who-box{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.who-label{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.avatars{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.av{font-size:30px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:2.5px solid transparent}
.av[aria-pressed="true"]{border-color:var(--heart);background:var(--heart-soft)}

.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:68px;border-radius:24px;font-family:var(--display);font-weight:600;font-size:22px;padding-inline:22px}
.big svg{width:28px;height:28px}
.primary{background:var(--accent);color:#262625}
.soft{background:var(--surface);border:1.5px solid var(--line)}
.row{display:flex;gap:12px}.row>*{flex:1}
.push{margin-top:auto;display:flex;flex-direction:column;gap:12px}

/* Gesten */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow-y:auto;padding:2px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:104px;justify-content:center}
.card .e{font-size:40px;line-height:1}

.card[aria-pressed="true"]{border-color:var(--heart);background:var(--heart-soft);transform:scale(1.03)}
.card{transition:transform .15s}

/* Frage */
.duo{display:flex;align-items:center;justify-content:center;gap:14px}
.face{font-size:56px;width:92px;height:92px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center}
.gesture-big{font-size:72px;width:120px;height:120px;border-radius:30px;background:var(--heart-soft);display:grid;place-items:center}
.scale{display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-block:6px}
.scale button{padding:4px;border-radius:14px;display:grid;place-items:end center}
.scale svg{display:block;transition:transform .18s}
.scale button:active svg{transform:scale(.9)}
.hp{fill:var(--heart-empty);transition:fill .18s}
.on .hp{fill:var(--heart)}

/* Übergabe */
.handoff{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;border-radius:30px;background:var(--surface);border:2px dashed var(--line);padding:24px}
.handoff .face{width:150px;height:150px;font-size:96px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* Aufdecken */
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flip{perspective:800px;height:200px}
.flip-in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.open .flip-in{transform:rotateY(180deg)}
.side{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px solid var(--line);background:var(--surface)}
.side .face{width:64px;height:64px;font-size:38px;border:0;background:var(--bg)}
.back{transform:rotateY(180deg);background:var(--heart-soft);border-color:transparent}
.cover{font-family:var(--display);font-size:40px;color:var(--muted)}
.mini{display:flex;align-items:flex-end;gap:2px}
.result{min-height:96px;text-align:center;display:flex;flex-direction:column;gap:6px;justify-content:center}
.result h2{font-size:24px}
.result[hidden]{display:none}
.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.burst span{position:absolute;bottom:-40px;animation:up 2.2s ease-out forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(var(--r));opacity:0}}

/* Album */
.list{display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:10px 14px}
.item .e{font-size:36px;width:52px;text-align:center}
.item .t{flex:1;min-width:0}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--muted)}

/* Darstellung je Zielgruppe */
.gesture-big.line{background:var(--surface);border:2px solid var(--line);color:var(--fg)}

.meme{width:min(100%,330px);aspect-ratio:4/3;margin:0 auto;border-radius:18px;position:relative;display:grid;place-items:center;overflow:hidden;color:#EDE8DC;

.mt,.mb{position:absolute;left:10px;right:10px;text-align:center;font-family:"Anton",Impact,"Arial Black",sans-serif;text-transform:uppercase;color:#fff;
  font-size:clamp(19px,5.6vw,27px);line-height:1.05;letter-spacing:.01em;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-wrap:balance}

.meme.sm .mt{top:6px}.meme.sm .mb{bottom:6px}
.ic-sm{display:grid;place-items:center;width:52px;height:52px}
.ic-sm svg{width:34px;height:34px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}

/* Zwei Geräte */
.code{display:flex;justify-content:center;gap:10px}
.code span{width:58px;height:70px;border-radius:16px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:36px;font-weight:600}

/* Lebensphasen-Regler */

  labels(P,rel,younger);

/* ---------- Sprache & Vorlesen ---------- */
/* Vorlesen über die Sprachausgabe des Geräts.
   Stolpersteine, die hier abgefangen werden:
   - iOS/Android geben erst Ton aus, nachdem eine Ausgabe direkt aus einer Berührung kam → "Entsperren" beim ersten Tippen
   - Chrome verschluckt ein speak() direkt nach cancel() → kurze Pause dazwischen
   - Chrome bricht ab, wenn die Ausgabe vom Speicher weggeräumt wird → Referenz behalten
   - Manche eingebetteten Ansichten (z. B. In-App-Browser unter Android) haben gar keine Sprachausgabe → erkennen und Hinweis zeigen */
let TTS_OK=("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined";
let voice=null, ttsUnlocked=false, ttsWarned=false, speakTimer=0;
const ttsKeep=[];
function pickVoice(){
  if(!TTS_OK)return;
  try{
    const pre=EN_ON()?"en":"de";
    const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().replace("_","-").startsWith(pre));
    voice=v.find(x=>x.localService&&/Anna|Helena|Petra|Samantha|Karen|Daniel/i.test(x.name))||v.find(x=>x.localService)||v[0]||null;
  }catch(e){voice=null}
}
if(TTS_OK){pickVoice();try{speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){speechSynthesis.onvoiceschanged=pickVoice}}
function unlockTTS(){
  if(ttsUnlocked||!TTS_OK)return;ttsUnlocked=true;
  try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;u.lang=EN_ON()?"en-GB":"de-DE";speechSynthesis.speak(u)}catch(e){}
}
document.addEventListener("pointerdown",unlockTTS,{capture:true});
document.addEventListener("touchend",unlockTTS,{capture:true});
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.classList.add("out"),5200);setTimeout(()=>t.remove(),5800);
}
function ttsMissing(){
  if(ttsWarned)return;ttsWarned=true;
  toast(L("Vorlesen funktioniert in dieser Ansicht nicht. Öffne mBond in Chrome oder Safari und prüfe die Medienlautstärke.","Reading aloud doesn't work in this view. Open mBond in Chrome or Safari and check the media volume."));
}
function speak(t,fromTap){
  if(!S.sound||!t)return;
  if(!TTS_OK){if(fromTap)ttsMissing();return}
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    clearTimeout(speakTimer);
    speakTimer=setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(t);
      u.lang=voice?voice.lang:(EN_ON()?"en-GB":"de-DE");u.rate=.95;u.pitch=1.1;if(voice)u.voice=voice;
      let started=false;u.onstart=()=>{started=true};
      u.onerror=e=>{if(e&&e.error==="not-allowed")ttsUnlocked=false};
      ttsKeep.push(u);if(ttsKeep.length>4)ttsKeep.shift();
      try{speechSynthesis.resume()}catch(e){}
      speechSynthesis.speak(u);
      // Keine Stimme und kein Start nach 2 s: Sprachausgabe fehlt hier offenbar
      setTimeout(()=>{if(!started&&!speechSynthesis.speaking&&!speechSynthesis.getVoices().length){TTS_OK=false;setHeader();if(fromTap)ttsMissing()}},2000);
    },80);
  }catch(e){}
}
const sayBtn=t=>`<button class="icon-btn" data-say="${esc(t)}" aria-label="${L("Vorlesen","Read aloud")}">${SPK_SMALL}</button>`;
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){unlockTTS();speak(b.dataset.say,true)}});
function setHeader(){
  $("#soundBtn").innerHTML=S.sound&&TTS_OK?SPK_ON:SPK_OFF;
  $("#soundBtn").setAttribute("aria-label",TTS_OK?L("Vorlesen an oder aus","Read aloud on or off"):L("Vorlesen nicht verfügbar","Reading aloud not available"));

  const lb=$("#langBtn");lb.textContent=EN_ON()?"DE":"EN";lb.setAttribute("aria-label",L("Switch to English","Auf Deutsch wechseln"));
  document.documentElement.lang=S.lang;
}
$("#soundBtn").onclick=()=>{

function afterPeople(A,B,next){

const ENDING={klein:"spruch",kind:"spruch",kinder:"spruch",teen:"meme",jung:"idee",paar:"idee"};

/* ---------- Zufällige Geste ---------- */
function playedFor(ai){const p=CUR.P[ai];return p.id&&person(p.id)?(S.album[p.id]||{}):(CUR.played[ai]||(CUR.played[ai]={}))}
function drawGesture(ai,exclude){
  const p=pool(ai), played=playedFor(ai), rk=CUR.key||"anon", rec=S.recent[rk]||[];
  let c=p.filter(g=>g.id!==exclude&&!rec.includes(g.id));
  if(!c.length)c=p.filter(g=>g.id!==exclude);
  if(!c.length)c=p;
  const fresh=c.filter(g=>!played[g.id]);
  let list=fresh.length?fresh:[...c].sort((a,b)=>played[a.id].t-played[b.id].t).slice(0,Math.max(2,Math.ceil(c.length/2)));
  const own=list.filter(g=>g.custom);
  if(own.length&&Math.random()<.6)return own[Math.floor(Math.random()*own.length)];
  list=list.filter(g=>!g.custom).length?list.filter(g=>!g.custom):list;
  const W=WEIGHTS[CUR.g], cats=["s","w","e"].filter(k=>list.some(g=>g.c===k));
  if(cats.length){
    const tot=cats.reduce((n,k)=>n+W[k],0); let r=Math.random()*tot, cat=cats[0];
    for(const k of cats){if((r-=W[k])<0){cat=k;break}}
    list=list.filter(g=>g.c===cat);
  }
  return list[Math.floor(Math.random()*list.length)];
}
function nextAnswerer(n){return CUR.asym?(n%2?CUR.younger:CUR.older):(n%2?1:0)}
function start(){
  if(CUR.n>=CUR.total)return endGame();
  CUR.n++;
  const ai=nextAnswerer(CUR.n);
  R={ai,gi:1-ai,g:drawGesture(ai)};
  ask("guess");
}
const progress=(n,t,code)=>`<div class="link-pill">${code?`📱 ${code} · `:""}${L(`Frage ${n} von ${t}`,`Question ${n} of ${t}`)}</div>`;

/* ---------- Herzen wählen ---------- */
function askScreen(role,p,g0,ai,withOther,pill){

  const title=guess?L("Was glaubst du?","What do you think?"):(GROUPS[group()].young?L("Wie doll?","How much?"):L("Wie sehr?","How much?"));
  const hint=guess?stripGuess(q):(kid?L("Je größer das Herz, desto stärker.","The bigger the heart, the stronger."):q);
  const meme=style()==="meme";
  show(`
  ${pill||""}
  ${meme?`<div class="duo"><div class="face" style="width:56px;height:56px;font-size:32px">${p.av}</div></div>${art(g)}`
       :`<div class="duo draw spin"><div class="face">${p.av}</div>${art(g)}</div><div class="gname">${esc(g.n)}</div>`}
  <div class="say"><h2>${title}</h2>${kid?sayBtn(q):""}</div>
  <p class="hint">${esc(hint)}</p>
  <div class="scale" role="radiogroup" aria-label="${L("Stärke, 1 bis 5","Strength, 1 to 5")}">
    ${[1,2,3,4,5].map(i=>`<button role="radio" aria-checked="false" aria-label="${w[i-1]}" data-v="${i}">${heart(30+i*9)}</button>`).join("")}
  </div>
  ${withOther?`<button class="tiny" id="other">${DICE}<span>${L("Passt nicht? Andere Geste","Doesn't fit? Another one")}</span></button>`:""}
  <div class="push"><button class="big primary" id="ok" disabled>${CHECK}<span>${L("Fertig","Done")}</span></button></div>`);
  if(kid)speak(q);
  let v=0;
  stage.querySelectorAll(".scale button").forEach(b=>b.onclick=()=>{
    v=+b.dataset.v;
    stage.querySelectorAll(".scale button").forEach(x=>{x.classList.toggle("on",+x.dataset.v<=v);x.setAttribute("aria-checked",+x.dataset.v===v)});
    $("#ok").disabled=false;if(kid)speak(w[v-1]);
  });
  return new Promise(res=>{$("#ok").onclick=()=>{if(v)res(v)}});
}
async function ask(role){
  const guess=role==="guess", p=CUR.P[guess?R.gi:R.ai];
  const pr=askScreen(role,p,R.g,R.ai,guess,progress(CUR.n,CUR.total));
  if(guess)$("#other").onclick=()=>{R.g=drawGesture(R.ai,R.g.id);ask("guess")};
  const v=await pr;
  if(guess){R.gv=v;handoff()}else{R.av=v;reveal()}
}

/* ---------- Weitergeben ---------- */
function handoff(){

/* ---------- Aufdecken ---------- */
function outcome(){
  const ans=CUR.P[R.ai], d=R.av-R.gv, ad=Math.abs(d);
  if(ad===0)return [L("Genau gleich!","Exactly the same!"),L("Ihr kennt euch richtig gut.","You really know each other."),ad];
  if(ad===1)return [L("Ganz nah beieinander!","So close!"),L("Fast dasselbe Gefühl.","Almost the same feeling."),ad];
  if(d>0)return [L("Oh, das ist neu!","Oh, that's new!"),L(`Das bedeutet ${ans.dat} noch mehr, als gedacht. Erzählt euch mal, warum!`,`It means even more to ${ans.nom} than expected. Tell each other why!`),ad];
  return [L("Oh, das ist neu!","Oh, that's new!"),L(`Fragt mal nach: Was fühlt sich für ${ans.nom} noch schöner an?`,`Ask: What would feel even better for ${ans.nom}?`),ad];
}
function record(){
  const ans=CUR.P[R.ai], gs=CUR.P[R.gi], g=loc(R.g);
  const store=playedFor(R.ai), before=store[R.g.id];
  store[R.g.id]={k:R.av,a:R.gv,t:Date.now(),e:R.g.e||"",i:R.g.i||"",n:g.n,by:gs.av};
  if(ans.id&&person(ans.id))S.album[ans.id]=store;
  const rk=CUR.key||"anon", rec=S.recent[rk]||(S.recent[rk]=[]);rec.push(R.g.id);while(rec.length>4)rec.shift();
  CUR.res=CUR.res||[];CUR.res.push({id:R.g.id,n:g.n,e:R.g.e||"",i:R.g.i||"",c:R.g.c||"s",gv:R.gv,av:R.av,ai:R.ai,custom:!!R.g.custom});
  if(!M.nr)S.session={P:CUR.P.map(slim),rel:CUR.rel,n:CUR.n,total:CUR.total,res:CUR.res};
  S.rounds++;save();
  return before;
}
function reveal(onNext){

      const o=obj(), young=GROUPS[g].young, love=GROUPS[g].asym&&dir==="kid";
      const q=EN_ON()?(young?(love?`How loved do you feel ${o.p}?`:`How happy are you ${o.p}?`):`How much does it mean to you ${o.p}?`)
                     :(young?(love?`Wie doll fühlst du dich lieb gehabt, ${o.p}?`:`Wie doll freust du dich, ${o.p}?`):`Wie viel bedeutet es dir, ${o.p}?`);
      pv.innerHTML=st==="meme"?art(o,"sm","meme"):`<div class="preview">${thumb(o)}<span>${esc(q)}</span></div>`;
      sv.disabled=!(bn.value.trim()&&clean());
    };
    stage.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pick=b.dataset.p;stage.querySelectorAll("[data-p]").forEach(x=>x.setAttribute("aria-pressed",x===b));upd()});
    stage.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{dir=b.dataset.d;stage.querySelectorAll("[data-d]").forEach(x=>x.setAttribute("aria-pressed",x===b));upd()});
    stage.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{g=b.dataset.g;draw()});
    [bn,bp,mt,mb].forEach(x=>x&&(x.oninput=upd));upd();
    sv.onclick=()=>{
      if(!bn.value.trim()||!clean())return;
      (S.custom[g]||(S.custom[g]=[])).push({...obj(),id:"c"+Date.now(),custom:true,dir:GROUPS[g].asym?dir:"both"});
      save();manage(after);
    };
  };
  draw();
}
function manage(after){
  const all=Object.entries(S.custom).flatMap(([g,l])=>l.map(c=>({...c,g})));

  <div class="say"><h2>${L("Eure Bondings","Your bondings")}</h2></div>

/* ---------- Album ---------- */
function album(pid){
  const people=S.people;
  if(!people.length){
    show(`<div class="say"><h2>${L("Album","Album")}</h2></div>
    <div class="empty"><span class="e">📖</span><h2>${L("Noch leer","Still empty")}</h2><p class="hint">${L("Legt beim nächsten Spiel Personen an. Dann sammelt sich hier, was jedem von euch am meisten bedeutet.","Add people in your next game. This is where you'll see what matters most to each of you.")}</p></div>
    <div class="push"><button class="big primary" id="play">${ARROW}<span>${L("Spielen","Play")}</span></button></div>`);
    $("#play").onclick=()=>setup(start);return;
  }
  const cur=person(pid)||people[0];
  const a=S.album[cur.id]||{};
  const items=Object.entries(a).map(([id,x])=>({...x,n:nameFor(id,x.n)})).sort((x,y)=>y.k-x.k||y.t-x.t);
  const row=(v,s)=>`<span class="mini">${[1,2,3,4,5].map(i=>`<span class="${i<=v?"on":""}">${heart(s+i*2)}</span>`).join("")}</span>`;
  const top=[...items].sort((x,y)=>Math.abs(y.k-y.a)-Math.abs(x.k-x.a))[0];
  const find=top&&Math.abs(top.k-top.a)>=2?`<div class="find">${thumb(top)}<div><b>${L("Größte Entdeckung","Biggest discovery")}: ${esc(top.n)}</b><span>${L(`${top.by||""} hat ${top.a} ${top.a>1?"Herzen":"Herz"} geschätzt, ${cur.av} fühlt ${top.k}.`,`${top.by||""} guessed ${top.a} heart${top.a>1?"s":""}, ${cur.av} feels ${top.k}.`)}</span></div></div>`:"";
  show(`
  <div class="say"><h2>${L("Album","Album")}</h2></div>
  <div class="people">${people.map(p=>`<button class="chip" data-p="${p.id}" aria-pressed="${p.id===cur.id}"><span class="st-ic">${p.av}</span>${esc(p.name)}</button>`).join("")}</div>
  ${items.length?`${find}<div class="list">${items.map(x=>`<div class="item">${thumb(x)}<div class="t"><div class="n">${esc(x.n)}</div><div class="g">${x.by||""} ${L("geschätzt","guessed")} ${row(x.a,6)}</div></div>${row(x.k,12)}</div>`).join("")}</div>`
  :`<div class="empty"><span class="e">${cur.av}</span><h2>${L("Noch leer","Still empty")}</h2><p class="hint">${L(`Sobald ${esc(cur.name)} eine Frage beantwortet hat, steht hier, was am meisten bedeutet.`,`Once ${esc(cur.name)} has answered a question, you'll see here what matters most.`)}</p></div>`}
  ${nudge(L("Eigenes Bonding erstellen","Create your own bonding"),ownCount()?L(`${ownCount()} eigene schon dabei. Was fehlt noch?`,`${ownCount()} of your own so far. What's missing?`):L("Was macht nur ihr zwei miteinander?","What do only you two do together?"))}
  ${ownCount()?`<button class="tiny" id="mg">${L("Eigene Bondings verwalten","Manage your bondings")}</button>`:""}
  ${S.supporter?`<div class="supporter"><span>💛 ${L("Unterstützer · Dankeschön-Paket aktiv","Supporter · thank-you pack active")}</span>
      <button class="chip" id="goldBtn" aria-pressed="${!!S.gold}">${L("Goldene Herzen","Golden hearts")}</button></div>`
    :S.rounds>=5?`<div id="gateSlot"><button class="tiny" id="forParents">${L("Für Eltern: mBond unterstützen","For parents: support mBond")}</button></div>`:""}
  <div class="push"><button class="big primary" id="play">${ARROW}<span>${L("Spielen","Play")}</span></button></div>`);
  wireTip();
  stage.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>album(b.dataset.p));
  const gb=$("#goldBtn");if(gb)gb.onclick=()=>{S.gold=!S.gold;save();setGold();gb.setAttribute("aria-pressed",!!S.gold)};
  const fp=$("#forParents");if(fp)fp.onclick=()=>parentGate($("#gateSlot"),()=>{$("#gateSlot").innerHTML=tipCard("album");wireTip()});
  wireNudge(()=>album(cur.id));
  if(ownCount())$("#mg").onclick=()=>manage(()=>album(cur.id));
  $("#play").onclick=()=>setup(start);
}

let LAST=null;  // letztes Ergebnis, für das Teilen-Bild
function endGame(){
  const res=CUR.res||[], type=ENDING[CUR.g], ext=LENGTH[type][1], lg=S.lang;
  const nm=r=>r.custom?r.n:nameFor(r.id,r.n);
  const close=res.filter(r=>Math.abs(r.av-r.gv)<=1).length, ratio=res.length?close/res.length:0;
  const tier=ratio>=.7?"hoch":ratio>=.4?"mittel":"neu";
  const surprise=[...res].sort((a,b)=>Math.abs(b.av-b.gv)-Math.abs(a.av-a.gv))[0];
  const tops=CUR.P.map((p,i)=>[...res].filter(r=>r.ai===i).sort((a,b)=>b.av-a.av)[0]);
  const A=CUR.P[0],B=CUR.P[1];
  if(!M.nr){S.session=null}
  if(!CUR.counted){CUR.counted=true;S.games=(S.games||0)+1}
  save();
  const allowed=tipAllowed(), games=S.games;
  const popupDue=allowed&&adultsOnly()&&!S.supporter&&games>=TIPCFG.firstPopup&&(!S.lastPopup||games-S.lastPopup>=TIPCFG.popupEvery);

  let body="",speakText="";
  LAST={type,tier,close,total:res.length,A,B,head:HEAD[lg][tier]};
  const topLine=i=>{const t=tops[i];if(!t)return "";const p=CUR.P[i];return `<div class="find">${thumb(t)}<div><b>${L("Ganz oben bei","Top for")} ${esc(p.nom)}: ${esc(nm(t))}</b><span>${L(`${t.av} von 5 Herzen`,`${t.av} of 5 hearts`)}</span></div></div>`};

  if(type==="spruch"){
    const sp=pickOne(SPRUCH[lg][tier]);
    const kid=CUR.asym?CUR.younger:null, t=kid!=null?tops[kid]:null;
    speakText=sp+(t?L(` Herz-Mission für heute: ${nm(t)}!`,` Heart mission for today: ${nm(t)}!`):"");
    LAST.text=sp;LAST.sub=t?L(`Herz-Mission: ${nm(t)}`,`Heart mission: ${nm(t)}`):"";
    body=`<div class="quote">${esc(sp)}</div>
      ${t?`<div class="find">${thumb(t)}<div><b>${L("Herz-Mission für heute","Heart mission for today")}: ${esc(nm(t))}</b><span>${L(`Das hat ${esc(CUR.P[kid].nom)} heute am meisten bedeutet.`,`That meant the most to ${esc(CUR.P[kid].nom)} today.`)}</span></div></div>`:[0,1].map(topLine).join("")}`;
  }else if(type==="meme"){
    const [mt,mb]=pickOne(MEME_END[lg][tier]);
    const t=tops[CUR.asym?CUR.younger:1], icon=tier==="hoch"?"star":tier==="mittel"?"summit":"sun";
    LAST.mt=mt;LAST.mb=mb;LAST.icon=icon;LAST.sub=t?L(`Am meisten bedeutet: ${nm(t)}`,`Means the most: ${nm(t)}`):"";
    body=`<div class="meme"><span class="mt">${esc(mt)}</span>${iconSvg(icon,1.4)}<span class="mb">${esc(mb)}</span></div>
      ${t?`<p class="hint">${L(`Fun Fact: Am meisten bedeutet heute „${esc(nm(t))}“.`,`Fun fact: “${esc(nm(t))}” means the most today.`)}</p>`:""}`;
    speakText=mt+". "+mb;
  }else{
    const avg=k=>{const l=res.filter(r=>(r.c||"s")===k);return l.length?l.reduce((n,r)=>n+r.av,0)/l.length:0};
    const cat=["s","w","e"].sort((a,b)=>avg(b)-avg(a)||Math.random()-.5)[0];
    const set=IDEEN[lg][CUR.rel]||IDEEN[lg].freunde, idee=pickOne(set[cat]);
    LAST.text=idee;LAST.sub=L("Unsere Idee für diese Woche","Our idea for this week");
    body=`<div class="idea"><span class="who-label">${L("Eure Idee für diese Woche","Your idea for this week")}</span><p>${esc(idee)}</p>
      <span class="hint">${L(`Weil euch heute vor allem ${CAT_WORD.de[cat]} Momente viel bedeutet haben.`,`Because ${CAT_WORD.en[cat]} moments meant the most to you today.`)}</span></div>
      ${[0,1].map(topLine).join("")}`;
    speakText=L("Eure Idee für diese Woche: ","Your idea for this week: ")+idee;
  }
  show(`
  <div class="duo"><span class="face">${A.av}</span><span class="face">${B.av}</span></div>
  <div class="say"><h2>${HEAD[lg][tier]}</h2></div>
  <p class="hint">${L(`${close} von ${res.length} Fragen fast gleich eingeschätzt`,`${close} of ${res.length} questions guessed almost the same`)}${surprise&&Math.abs(surprise.av-surprise.gv)>=2?L(` · größte Überraschung: ${esc(nm(surprise))}`,` · biggest surprise: ${esc(nm(surprise))}`):""}</p>
  ${body}
  ${allowed?`<div id="tipSlot">${S.supporter
    ?`<p class="thanks-line">💛 ${L("Danke, dass ihr mBond unterstützt!","Thank you for supporting mBond!")}</p>`
    :`<button class="tiny support-link" id="supportLink">☕ ${hasMinor()?L("Für Eltern: mBond unterstützen","For parents: support mBond"):L("mBond unterstützen","Support mBond")} · ${L("Dankeschön freischalten","unlock a thank-you")}</button>`}</div>`:""}
  <div class="push">
    <button class="big soft" id="share">${SHARE}<span>${L("Ergebnis teilen","Share result")}</span></button>
    ${!M.nr||M.host?`<button class="big soft" id="more">${PLUS}<span>${L(`${ext} Fragen mehr`,`${ext} more questions`)}</span></button>`:`<p class="hint">${L("Verlängern kann das Gerät, das den Code erstellt hat.","The device that created the code can extend the game.")}</p>`}
    <button class="big primary" id="done">${CHECK}<span>${L("Fertig","Done")}</span></button>
  </div>`);
  if(tier==="hoch")burst(26);
  $("#share").onclick=shareResult;
  const sl=$("#supportLink");if(sl)sl.onclick=()=>{$("#tipSlot").innerHTML=tipCard("end");wireTip()};
  if(popupDue){S.lastPopup=games;save();setTimeout(()=>tipPopup(games),1600)}
  const more=$("#more");
  if(more)more.onclick=()=>{CUR.total+=ext;if(M.nr){newRound()}else{S.session={P:CUR.P.map(slim),rel:CUR.rel,n:CUR.n,total:CUR.total,res:CUR.res};save();start()}};
  $("#done").onclick=()=>home();
}

/* Kinder und Jugendliche sehen nie eine Bitte um Geld.
   Spielt jemand bis zum Teenager-Alter mit, gibt es am Spielende keinen Trinkgeld-Hinweis.
   Im Album ist er hinter einer Eltern-Sperre (Rechenaufgabe in Worten). */
const youngest=()=>CUR?Math.min(...CUR.P.map(p=>rank(p.stage))):9;
const hasMinor=()=>youngest()<=2;
const tipAllowed=()=>youngest()>=2&&(!M.nr||rank(CUR.P[M.role].stage)>=3); // ab Teenager, aber nie auf dem Gerät eines Teens
const adultsOnly=()=>youngest()>=3;
const TIPCFG={firstPopup:3,popupEvery:10};
const NUMW={de:["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun"],en:["zero","one","two","three","four","five","six","seven","eight","nine"]};
function parentGate(slot,onPass){
  const a=3+Math.floor(Math.random()*6), b=4+Math.floor(Math.random()*5), w=NUMW[S.lang];
  slot.innerHTML=`<div class="gate">
    <b>${L("Nur für Erwachsene","Adults only")}</b>
    <label for="gateIn">${L(`Was ist ${w[a]} mal ${w[b]}?`,`What is ${w[a]} times ${w[b]}?`)}</label>
    <div class="gate-row"><input id="gateIn" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off"><button class="copy" id="gateOk">${L("Weiter","Next")}</button></div>
    <span class="gate-msg" id="gateMsg"></span>
  </div>`;
  const inp=$("#gateIn"), go=()=>{if(+inp.value===a*b)onPass();else{$("#gateMsg").textContent=L("Das stimmt leider nicht.","That's not right.");inp.value=""}};
  $("#gateOk").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
}

/* Zählen ohne Cookies und ohne persönliche Daten (GoatCounter).
   Eigenen Code eintragen, z. B. "mbond" für https://mbond.goatcounter.com – leer = es wird nichts gezählt. */
const TRACK={goatcounter:""};
const counted={};
function track(name,once){
  if(PREVIEW)return;
  if(!TRACK.goatcounter||(once&&counted[name]))return;counted[name]=1;
  try{
    const u=`https://${TRACK.goatcounter}.goatcounter.com/count?p=${encodeURIComponent("/event/"+name)}&t=${encodeURIComponent(name)}&e=true&rnd=${Math.random().toString(36).slice(2)}`;
    if(navigator.sendBeacon)navigator.sendBeacon(u);else new Image().src=u;

function wrapText(ctx,text,x,y,maxW,lh,maxLines){
  const words=String(text).split(" ");let line="",lines=[];
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}
  if(line)lines.push(line);
  lines=lines.slice(0,maxLines);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));
  return y+lines.length*lh;
}

}

/* =========================================================
   Zwei Geräte: eine Verbindungsschicht, zwei Wege
   1. In Claude: der geteilte Raum der Seite (claude.use("room"))
   2. Eigenständig (GitHub): direkte Gerät-zu-Gerät-Verbindung (WebRTC über PeerJS).
      Im selben WLAN fließen die Daten direkt im Heimnetz, aus der Ferne über das Internet.
      Für schwierige Netze (Mobilfunk, Firmen-WLAN) kann unten ein TURN-Server eingetragen werden.
   ========================================================= */
const PEER_CONFIG={
  prefix:"mbond-app-",
  iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:global.stun.twilio.com:3478"}
    /* Fern-Variante für schwierige Netze: eigenen TURN-Server ergänzen, z. B.
       {urls:"turn:DEIN-SERVER:3478",username:"…",credential:"…"} */]
};
let roomApi=null, roomTried=false;
(async()=>{try{roomApi=await window.claude?.use?.("room")||null}catch(e){roomApi=null}roomTried=true})();

function peerJoin(code,host){
  return new Promise((res,rej)=>{
    const id=PEER_CONFIG.prefix+code, me={}, hs=[];let other=null, conn=null, done=false;
    const peers=()=>{const a=[{peer:"me",sameTab:true,presence:me}];if(conn&&other)a.push({peer:"other",sameTab:false,presence:other});return a};
    const fire=()=>{const p=peers();hs.forEach(h=>setTimeout(()=>h({peers:p}),0))};
    const wire=c=>{conn=c;
      c.on("data",d=>{if(d&&d.t==="p"){other=d.p;fire()}});
      c.on("open",()=>{c.send({t:"p",p:me});fire()});
      c.on("close",()=>{other=null;conn=null;fire()});};
    const api={
      presence:async p=>{for(const k in p){if(p[k]===null)delete me[k];else me[k]=p[k]}if(conn&&conn.open)conn.send({t:"p",p:me});fire()},
      onPeers:h=>{hs.push(h);fire();return()=>{}},
      peers,
      leave:async()=>{try{peer.destroy()}catch(e){}}
    };
    const opts={config:{iceServers:PEER_CONFIG.iceServers}};
    const peer=host?new Peer(id,opts):new Peer(opts);
    const fail=e=>{if(!done){done=true;clearTimeout(timer);try{peer.destroy()}catch(x){}rej(e)}};
    const timer=setTimeout(()=>fail({type:"timeout"}),15000);
    peer.on("error",e=>fail(e));
    peer.on("open",()=>{
      if(host){peer.on("connection",c=>{if(conn&&conn.open){c.close();return}wire(c)});done=true;clearTimeout(timer);res(api)}
      else{const c=peer.connect(id,{reliable:true});wire(c);c.on("open",()=>{if(!done){done=true;clearTimeout(timer);res(api)}})}
    });
  });
}
const transport=()=>roomApi?{kind:"claude",join:code=>roomApi.join("mbond-"+code)}
  :(window.Peer?{kind:"direct",join:(code,host)=>peerJoin(code,host)}:null);

async function connect(code,host,role,tries){
  leaveRoom();
  M={nr:null,code,host,role,round:null,my:null,next:null,shown:0};
  waiting();
  try{M.nr=await transport().join(code,host)}
  catch(e){
    const t=e&&e.type;
    if(host&&t==="unavailable-id"&&tries<4)return connect(newCode(),true,role,tries+1);
    connFail(t==="peer-unavailable"
      ?L("Zu diesem Code gibt es gerade kein Spiel. Prüft die Ziffern und ob das andere Gerät den Code noch anzeigt.","There's no game with this code right now. Check the digits and that the other device still shows the code.")
      :L("Das hat gerade nicht geklappt. Prüft die Internetverbindung beider Geräte und versucht es noch einmal.","That didn't work. Check the internet connection on both devices and try again."));
    return;
  }
  if(host)waiting();
  push();
  M.unsub=M.nr.onPeers(ch=>sync(ch.peers),()=>{});
}
function slim(p){return {id:p.id,name:p.name,av:p.av,stage:p.stage,anon:!!p.anon}}
function push(){
  if(!M.nr)return;
  const p={v:2,host:M.host,role:M.role,ans:M.my,next:M.next};
  if(M.host){p.cfg={P:CUR.P.map(slim),rel:CUR.rel};p.round=M.round}
  M.nr.presence(p).catch(()=>{});
}
function sync(peers){
  if(!M.nr)return;
  const o=peers.find(p=>!p.sameTab&&p.presence&&p.presence.v===2);
  if(!o)return;
  const op=o.presence;
  if(!M.host){
    if(!op.host||!op.cfg)return;
    if(M.role!==1-op.role){M.role=1-op.role;push()}
    if(!CUR||CUR._cfg!==JSON.stringify(op.cfg)){const c=op.cfg;CUR=makeCtx({...c.P[0]},{...c.P[1]},c.rel);CUR._cfg=JSON.stringify(op.cfg)}
    if(op.round&&op.round.end&&!M.ended&&M.shown===op.round.n){M.ended=true;M.round=op.round;endGame();return}
    if(op.round&&!op.round.end&&(!M.round||op.round.n!==M.round.n)){M.ended=false;M.round=op.round;M.my=null;M.next=null;push();mpAsk();return}
  }else{
    if(!M.round){newRound();return}
    if(!M.round.end&&op.next===M.round.n&&M.shown===M.round.n){newRound();return}
  }
  if(M.round&&M.my&&M.my.n===M.round.n&&op.ans&&op.ans.n===M.round.n&&M.shown!==M.round.n){
    M.shown=M.round.n;mpReveal(M.my.v,op.ans.v);
  }
}
function newRound(){
  if(CUR.n>=CUR.total){M.round={...M.round,end:true};push();endGame();return}
  CUR.n++;
  const n=CUR.n, ai=nextAnswerer(n), g=drawGesture(ai);
  M.round={n,total:CUR.total,ai,g:{id:g.id,e:g.e||"",n:g.n,p:g.p,i:g.i||"",mt:g.mt||"",mb:g.mb||"",c:g.c||"s",custom:!!g.custom}};
  M.my=null;M.next=null;push();mpAsk();
}
async function mpAsk(){
  const r=M.round, guess=M.role!==r.ai;
  const v=await askScreen(guess?"guess":"answer",CUR.P[M.role],r.g,r.ai,false,progress(r.n,r.total,M.code));
  M.my={n:r.n,v};push();
  const other=CUR.P[1-M.role];
  show(`
  <div class="handoff" style="cursor:default">
    <div class="face">${other.av}</div>
    <span class="h2like">${L("Gleich geht's los!","Almost there!")}</span>
    <p class="hint">${L(`Deine Antwort ist sicher. Wir warten, bis ${other.anon?"die andere Person":esc(other.name)} fertig ist.`,`Your answer is safe. Waiting for ${other.anon?"the other person":esc(other.name)} to finish.`)}</p>
    <div class="mini pulse">${heart(22,"on")}${heart(28,"on")}${heart(22,"on")}</div>
  </div>`);
  sync(M.nr.peers());
}
function mpReveal(myV,oV){
  const r=M.round, guess=M.role!==r.ai;
  R={ai:r.ai,gi:1-r.ai,g:r.g,gv:guess?myV:oV,av:guess?oV:myV};
  reveal(()=>{
    if(M.host){newRound();return}
    M.next=M.round.n;push();
    const a=$("#again");a.disabled=true;a.querySelector("span").textContent=L("Warte auf das andere Gerät …","Waiting for the other device …");
  });
  setTimeout(()=>{const o=$("#open");if(o)o.click()},500);
}

function applyPlus(){
  if(plusApplied||!S.supporter)return;plusApplied=true;
  const target={"klein:y":SETS.klein,"klein:o":SWAP.klein,"kind:y":SETS.kind,"kind:o":SWAP.kind,"teen:y":SETS.teen,"teen:o":SWAP.teen,"jung:y":SETS.jung,"jung:o":SWAP.jung,"kinder":SYM.kinder,"paar":SYM.paar};

    const t=TAGS[k]||(TAGS[k]={w:"",e:""});
    for(const row of list){
      const cat=row[row.length-1], data=row.slice(0,-1);
      target[k].push(data);

  ];

  S=Object.assign(JSON.parse(PREVIEW.snap),{supporter:false,gold:false});setGold();

  <div class="say"><h2>🧪 ${L("Vorschau: Unterstützung","Preview: support")}</h2></div>

    const k=b.dataset.sc;
    if(k==="pop"||k==="unlock"){S.games=2;S.lastPopup=0;S.tipVia="paypal";end("erwachsen","partner",["Anna","👩","Ben","👨"])}
    if(k==="subtle"){S.games=4;S.lastPopup=3;end("erwachsen","partner",["Anna","👩","Ben","👨"])}
